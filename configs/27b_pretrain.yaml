# CodeForge AI - 27B Coding Model Pretraining Configuration
model:
  name: "codeforge-h-xl-27b"
  architecture: "Hybrid Decoder (RoPE + SwiGLU + Pre-RMSNorm + MTP)"
  vocab_size: 49152
  d_model: 5120
  n_layers: 64
  n_heads: 40
  n_kv_heads: 8
  head_dim: 128
  d_ff: 13824
  max_seq_len: 4096
  rope_base: 100000.0
  tie_embeddings: true
  mtp_aux_weight: 0.2

training:
  objective: "causal_lm_and_fim"
  learning_rate: 1.5e-4
  min_learning_rate: 1.5e-5
  lr_scheduler: "cosine"
  warmup_steps: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0

batch_and_compute:
  global_batch_size: 512
  micro_batch_size_per_gpu: 1
  gradient_accumulation_steps: 64
  mixed_precision: "bf16"
  gradient_checkpointing: true
  distributed_framework: "DeepSpeed ZeRO-3 / FSDP"
  recommended_cluster: "8x NVIDIA H100 80GB GPUs"

data:
  train_file: "datasets/processed/pretraining_fim.jsonl"
  context_packing: true
  fim_rate: 0.5
