# Budget & Compute Ladder Configuration
version: 1.0.0
max_usd: 300.0  # Hard budget ceiling for pilot development and smoke tests
cost_per_gpu_hour_usd: 2.50  # Typical H100 hourly spot/on-demand rate
mfu_assumed: 0.40  # 40% Model Flops Utilization (MFU) on modern tensor cores
h100_peak_tflops: 989.0  # FP16/BF16 Tensor Core peak without sparsity

