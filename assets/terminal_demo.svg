      <tspan fill="#64748b"> ... </tspan>
      <tspan fill="#f87171">FAILED</tspan>
      <tspan fill="#64748b"> (AssertionError: 401 != 500 in test_auth_unauthorized)</tspan>
    </text>

    <!-- Phase 4: Self-Repair -->
    <text x="0" y="202">
      <tspan fill="#ec4899" font-weight="700">[4/5 REPAIR]</tspan>
      <tspan fill="#94a3b8"> Bounded Self-Repair triggered </tspan>
      <tspan fill="#a855f7">(Attempt 1/3)</tspan>
    </text>
    <text x="24" y="226" fill="#38bdf8">→ Analyzed traceback: Missing HTTPException(status_code=401) in backend/auth.py</text>
    <text x="24" y="246" fill="#34d399">→ Applied minimal unified AST patch to backend/auth.py (diff: +4 lines, -1 line)</text>
    <text x="24" y="266">
      <tspan fill="#94a3b8">→ Retesting sandbox: </tspan>
      <tspan fill="#34d399" font-weight="700">4 PASSED</tspan>
      <tspan fill="#64748b"> in 0.42s (100% test contract verified)</tspan>
    </text>

    <!-- Phase 5: Export -->
    <text x="0" y="304">
      <tspan fill="#34d399" font-weight="700">[5/5 EXPORT]</tspan>
      <tspan fill="#94a3b8"> Packaging verified project bundle...</tspan>
    </text>
    <text x="24" y="328" fill="#38bdf8">✔ Exported ZIP: exports/expense-tracker-v1.0.0.zip (SHA-256: 7d4a9f...)</text>
    <text x="24" y="348" fill="#64748b">✔ Continuous improvement feedback loop updated: staged_corrections.jsonl</text>

    <!-- Final Prompt with Blinking Cursor -->
    <text x="0" y="388">
      <tspan fill="#34d399" font-weight="700">priyan@codeforge-h</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~/projects</tspan><tspan fill="#94a3b8">$ </tspan><tspan fill="#38bdf8">curl -X GET http://127.0.0.1:8000/api/v1/projects/status</tspan>
      <tspan class="term-cursor" fill="#38bdf8">█</tspan>
    </text>
  </g>
</svg>
