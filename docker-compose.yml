version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeforge-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql://codeforge:secretpass@postgres:5432/codeforgedb
      - MODEL_BACKEND=mock
      - ALLOW_NETWORK_IN_SANDBOX=false
    volumes:
      - ./sandbox/projects:/app/sandbox/projects
      - ./reports:/app/reports
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: codeforge-postgres
    restart: always
    environment:
      - POSTGRES_USER=codeforge
      - POSTGRES_PASSWORD=secretpass
      - POSTGRES_DB=codeforgedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
